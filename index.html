<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#040405">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300&display=swap">
<title>PearBook</title>
<style>
@property --t{syntax:'<length>';inherits:false;initial-value:14px}
:root{--bg:#040405;--screen:#0c0d10;--screen2:#171920;--ink:#ecebe6;--dim:rgba(236,235,230,.3);--ln:rgba(236,235,230,.6);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scrollbar-gutter:stable}
body{background:var(--bg);color:var(--ink);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;caret-color:transparent}
*:focus:not(:focus-visible){outline:none}
body.locked{overflow:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#story section{height:100vh;height:100svh}
.rm #story section:nth-child(n+2){display:none}
#gl,#fb{position:fixed;inset:0;width:100%;height:100%}
#gl{display:block}
#fb{display:none;place-items:center}
.nogl #fb{display:grid}.nogl #gl{display:none}
.fw{width:min(72vw,620px)}
.fbs{display:grid;grid-template:repeat(3,1fr)/repeat(4,1fr);gap:2%;padding:4%;width:100%;aspect-ratio:16/10;border:6px solid #1b1c20;border-radius:14px;background:var(--screen);cursor:pointer}
.fc{border-radius:5px;background:rgba(236,235,230,.05)}
.fbb{display:block;height:12px;margin:0 -8%;border-radius:0 0 18px 18px;background:linear-gradient(#c9ccd1,#85888e)}
.hud{transition:opacity .5s}
body.in .hud{opacity:0!important;pointer-events:none}
.rm #nav,.rm #sc,.rm #co{display:none}
#mark{position:fixed;left:calc(env(safe-area-inset-left,0px) + 22px);top:calc(env(safe-area-inset-top,0px) + 22px);width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;opacity:.85;z-index:5}
#nav{position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;z-index:5}
#nav button{width:30px;height:30px;border:0;background:none;cursor:pointer;display:grid;place-items:center;border-radius:50%}
#nav button::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink);opacity:.28;transition:opacity .3s,transform .3s}
#nav button[aria-current=true]::after{opacity:1;transform:scale(1.6)}
#nav button:focus-visible,#x:focus-visible,.fbs:focus-visible,.cell a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#sc{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:1px;height:46px;background:var(--dim);overflow:hidden;z-index:5;transition:opacity .4s}
#sc i{position:absolute;inset:0;background:var(--ink);transform-origin:top;transform:scaleY(0)}
#co{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#co circle{fill:var(--ink)}
#ttl{--v:0;position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6vh);z-index:2;pointer-events:none;text-align:center;white-space:nowrap;color:var(--ink);font:200 clamp(1.6rem,4.6vw,5rem)/1.05 Sora,system-ui,'Helvetica Neue',Arial,sans-serif;letter-spacing:.12em;text-indent:.12em}
#ttl .w{display:inline-block}#ttl .sp{display:inline-block;width:.5em}
#ttl .l{display:inline-block;transform:translate3d(calc(var(--o)*var(--v)*1.4vw),calc(var(--v)*-10vh*(1 + var(--i)*.04)),0);opacity:calc(1 - var(--v)*1.5);will-change:transform,opacity}
#ttl .m{display:inline-block;overflow:hidden;vertical-align:top;padding:.12em .02em}
#ttl i{display:inline-block;font-style:normal;transform:translateY(115%);opacity:0}
#ttl.go i{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*55ms + 250ms)}
@keyframes rise{from{transform:translateY(115%);opacity:0}to{transform:none;opacity:1}}
@media (max-aspect-ratio:1/1){#ttl{font-size:clamp(1.8rem,9vw,4rem);top:calc(env(safe-area-inset-top,0px) + 9vh);white-space:normal}#ttl .w{display:block}#ttl .h,#ttl .sp{display:none}}
@media (prefers-reduced-motion:reduce){#ttl i{transform:none;opacity:1}}
#co path{stroke:var(--ln);stroke-width:1;fill:none}
#hit{position:fixed;z-index:4;inset:0;width:100%;height:100%;border:0;padding:0;background:transparent;cursor:pointer;pointer-events:none;-webkit-tap-highlight-color:transparent}
#hit::before{content:"";position:absolute;inset:0;background:rgba(236,235,230,.07);opacity:0}
#hit.on{pointer-events:auto}
#hit.cta::before{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:1}}
#hit:focus-visible{outline:none;background:rgba(236,235,230,.12);animation:none}
#cat{position:fixed;inset:0;z-index:7;background:radial-gradient(circle at 50% 50%,transparent 24vmax,rgba(236,235,230,.07) calc(24vmax + 1px),transparent calc(24vmax + 4px)),radial-gradient(38vmax 30vmax at 18% 22%,rgba(236,235,230,.14),transparent 70%),radial-gradient(34vmax 30vmax at 82% 78%,rgba(160,170,190,.13),transparent 70%),radial-gradient(120% 100% at 50% 0%,var(--screen2),var(--screen) 70%);
padding:calc(max(3.9vw,52px) + env(safe-area-inset-top,0px)) calc(3.9vw + env(safe-area-inset-right,0px)) calc(3.9vw + env(safe-area-inset-bottom,0px)) calc(3.9vw + env(safe-area-inset-left,0px));
opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s .4s}
#cat.on{opacity:1;visibility:visible;transition:opacity .7s ease}
#grid{list-style:none;height:100%;display:grid;grid-template:repeat(3,minmax(0,1fr))/repeat(4,minmax(0,1fr));gap:1.56vw}
.cell{position:relative;min-height:0;grid-column:var(--x)/span var(--w);grid-row:var(--y)/span var(--h);border-radius:22px;overflow:hidden;
background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.035) 45%,rgba(255,255,255,.07));
-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 0 0 1px rgba(255,255,255,.12),inset 0 -22px 34px -22px rgba(255,255,255,.09),0 20px 44px -20px rgba(0,0,0,.75);
opacity:0;transform:scale(.965);transition:opacity .5s ease,transform .5s ease}
.cell::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.24),transparent 38%);opacity:.5;transition:opacity .4s;pointer-events:none}
#cat.on .cell{opacity:1;transform:none;transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i)*70ms + 250ms)}
.cell:hover::before,.cell:focus-within::before{opacity:1}
#cat:not(.on) .cell{transition:opacity .15s ease;-webkit-backdrop-filter:none;backdrop-filter:none}
.cell .img,.cell a{position:absolute;inset:0;border-radius:inherit}
.lite #ttl .l{transform:none!important;opacity:1!important;will-change:auto}
.lite #ttl .w{opacity:calc(1 - var(--v)*1.5);transform:translateY(calc(var(--v)*-8vh))}
.lite .cell{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(135deg,rgba(66,68,76,.72),rgba(30,31,36,.72));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.12)}
.cell .img{background:center/cover}
#x{position:absolute;right:calc(env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 8px);width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:rgba(4,4,5,.5);cursor:pointer;z-index:2}
#x::before,#x::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:1px;background:var(--ink);transform:translate(-50%,-50%) rotate(45deg)}
#x::after{transform:translate(-50%,-50%) rotate(-45deg)}
@media (max-aspect-ratio:1/1){
#cat{padding:calc(60px + env(safe-area-inset-top,0px)) calc(5vw + env(safe-area-inset-right,0px)) calc(5vw + env(safe-area-inset-bottom,0px)) calc(5vw + env(safe-area-inset-left,0px))}
#grid{grid-template:repeat(6,minmax(0,1fr))/repeat(2,minmax(0,1fr));gap:3vw}
.cell{grid-column:span var(--mw);grid-row:span var(--mh)}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;transition-delay:0s!important;animation:none!important}}
</style>
</head>
<body>
<h1 class="sr" id="t"></h1>
<canvas id="gl" role="img"></canvas>
<div id="fb"></div>
<main id="story"></main>
<div id="ttl" class="hud" aria-hidden="true"></div>
<svg id="mark" class="hud" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-1.6 0-2.600 1.200-3 2.800-.4 1.300-2.500 2.200-2.500 5 0 2.800 2.200 4.700 5.500 4.700s5.500-1.900 5.500-4.700c0-2.800-2.100-3.700-2.500-5C14.600 8.200 13.600 7 12 7z"/><path d="M12 7c0-2 1-3.500 3-4"/></svg>
<svg id="co" class="hud" aria-hidden="true"></svg>
<nav id="nav" class="hud"></nav>
<div id="sc" class="hud" aria-hidden="true"><i></i></div>
<button id="hit" type="button" tabindex="-1"></button>
<div id="cat" inert><button id="x" type="button"></button><ul id="grid" role="list"></ul></div>

<script>
/* ===== CONFIGURATION MODIFIABLE ===== */
const CONFIG={
brand:'PearBook',
title:'PORTFOLIO - AXFLOW',
quality:'auto', /* 'auto' | 'low' | 'high' */
sr:{canvas:'Ordinateur portable PearBook en 3D, concept',open:'Ouvrir le catalogue',back:'Retour',nav:'Sections',empty:'Emplacement vide',
sections:['PearBook','Performance','Design et matériaux','Discrètement puissant','Catalogue']},
colors:{bg:'#040405',screen:'#0c0d10',screen2:'#171920',ink:'#ecebe6',metal:'#b9bcc2',key:'#0c0c0e'},
/* Emplacements réservés : null = rendu procédural actuel. Ex. screen:'pearbook-screen.webp' remplace l’écran. */
assets:{laptop:null,screen:null,mark:null},
openTheta:1.95,staticP:.3,
/* images clés : p = progression de défilement 0..1, theta = ouverture de l’écran (rad), rotY = rotation, cam/tgt = caméra/cible */
frames:[
{p:0,theta:0,rotY:-.5,cam:[2.4,2.7,6.4],tgt:[0,.25,0]},
{p:.28,theta:1.95,rotY:-.22,cam:[1.3,1.9,6.8],tgt:[0,1,-.5]},
{p:.55,theta:1.95,rotY:.12,cam:[-3.3,1.7,4.6],tgt:[0,.85,-.3]},
{p:.8,theta:0,rotY:.35,cam:[.6,4.6,4.4],tgt:[0,.1,.1]},
{p:1,theta:1.95,rotY:0,cam:[0,1.5,6.3],tgt:[0,1,-.5]}],
/* repères sans texte : ancre 3D + fenêtre de défilement + côté */
callouts:[{at:'lid',win:[.16,.42],dir:1},{at:'hinge',win:[.16,.42],dir:-1},{at:'pad',win:[.45,.67],dir:1},{at:'keys',win:[.45,.67],dir:-1}],
/* catalogue : grille 4x3 (x,y,w,h) ; m = largeur/hauteur sur mobile ; url/img à renseigner pour chaque site */
cells:[
{x:0,y:0,w:2,h:2,m:[2,2],url:'',img:''},{x:2,y:0,w:1,h:1,m:[1,1],url:'',img:''},{x:3,y:0,w:1,h:2,m:[1,2],url:'',img:''},
{x:2,y:1,w:1,h:1,m:[1,1],url:'',img:''},{x:0,y:2,w:1,h:1,m:[1,1],url:'',img:''},{x:1,y:2,w:2,h:1,m:[2,1],url:'',img:''},{x:3,y:2,w:1,h:1,m:[1,1],url:'',img:''}]
};
</script>
<script>
(()=>{
const C=CONFIG,$=s=>document.querySelector(s),B=document.body,H=document.documentElement;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const ultra0=weak||(C.quality!=='high'&&stored==='u');

 [...w].forEach(ch=>{const l=document.createElement('span');l.className='l';l.style.cssText=`--i:${k};--o:${(k-(N-1)/2).toFixed(2)}`;l.innerHTML='<span class="m"><i></i></span>';l.querySelector('i').textContent=ch;ew.append(l);k++});
 ttl.append(ew);if(wi<ws.length-1){const s=document.createElement('span');s.className='sp';ttl.append(s);k++}})}
const fontsReady=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
const goTitle=()=>fontsReady.then(()=>requestAnimationFrame(()=>ttl.classList.add('go')));setTimeout(goTitle,2600);$('#gl').setAttribute('aria-label',C.sr.canvas);$('#hit').setAttribute('aria-label',C.sr.open);
$('#x').setAttribute('aria-label',C.sr.back);$('#nav').setAttribute('aria-label',C.sr.nav);$('#cat').setAttribute('aria-label',C.sr.sections[4]);
const story=$('#story'),nav=$('#nav'),hit=$('#hit'),cat=$('#cat'),grid=$('#grid'),co=$('#co'),scI=$('#sc i'),sc=$('#sc');
C.sr.sections.slice(0,C.frames.length).forEach((s,i)=>{const e=document.createElement('section');e.setAttribute('aria-labelledby','h'+i);e.innerHTML='<h2 class="sr" id="h'+i+'"></h2>';e.firstChild.textContent=s;story.append(e);
 const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',s);b.onclick=()=>scrollTo({top:C.frames[i].p*(story.offsetHeight-innerHeight),behavior:reduce?'auto':'smooth'});nav.append(b)});
C.cells.forEach((c,i)=>{const li=document.createElement('li');li.className='cell';
 li.style.cssText=`--x:${c.x+1};--y:${c.y+1};--w:${c.w};--h:${c.h};--mw:${c.m[0]};--mh:${c.m[1]};--i:${i}`;
 if(c.img){const s=document.createElement('span');s.className='img';s.style.backgroundImage=`url("${c.img}")`;li.append(s)}
 if(c.url){const a=document.createElement('a');a.href=c.url;a.target='_blank';a.rel='noopener';a.setAttribute('aria-label',c.label||c.url);li.append(a)}
 else li.setAttribute('aria-label',`${C.sr.empty} ${i+1}`);grid.append(li)});
C.callouts.forEach(()=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML='<circle r="2.6"/><path d="M0 0l26-26h84m0-5v10"/>';g.style.opacity=0;co.append(g)});
const cos=[...co.children];

let target=0,prog=0,enter=0,entering=0,busy=false,catOpen=false,settled=false,three=false,hov=0,hovT=0;
let maxS=1;const calc=()=>{maxS=story.offsetHeight-innerHeight};
const readScroll=()=>{target=reduce?C.staticP:(maxS>0?Math.min(1,Math.max(0,scrollY/maxS)):0)};
calc();addEventListener('resize',()=>{calc();readScroll()});addEventListener('load',()=>{calc();readScroll()});
addEventListener('scroll',readScroll,{passive:true});readScroll();if(reduce)prog=target;

function openCat(){catOpen=true;cat.inert=false;cat.classList.add('on');B.classList.add('in');setTimeout(()=>$('#x').focus({preventScroll:true}),500)}
function closeCat(){catOpen=false;cat.classList.remove('on');cat.inert=true;B.classList.remove('in')}
let go=()=>{};
$('#x').onclick=()=>{three?go(-1):(closeCat(),B.classList.remove('locked'))};
addEventListener('keydown',e=>{if(e.key==='Escape'&&catOpen)$('#x').click()});
hit.onclick=()=>go(1);
hit.addEventListener('pointerenter',()=>hovT=1);hit.addEventListener('pointerleave',()=>hovT=0);
hit.addEventListener('focus',()=>hovT=1);hit.addEventListener('blur',()=>hovT=0);

function fallback(){
 H.classList.add('nogl','rm');ttl.style.setProperty('--v',0);scrollTo(0,0);goTitle();$('#fb').innerHTML='<div class="fw"><button class="fbs" type="button"></button><i class="fbb"></i></div>';
 const b=$('.fbs');b.setAttribute('aria-label',C.sr.open);C.cells.forEach(c=>{const s=document.createElement('span');s.className='fc';s.style.gridColumn=`${c.x+1}/span ${c.w}`;s.style.gridRow=`${c.y+1}/span ${c.h}`;b.append(s)});
 b.onclick=()=>{B.classList.add('locked');openCat()}}

function boot(){
 const T=THREE;let R;
 try{R=new T.WebGLRenderer({canvas:$('#gl'),antialias:!ultra0&&devicePixelRatio<2,powerPreference:'high-performance'});if(!R.getContext())throw 0}catch(e){return fallback()}
 try{const gl=R.getContext(),ex=gl.getExtension('WEBGL_debug_renderer_info'),rn=ex?String(gl.getParameter(ex.UNMASKED_RENDERER_WEBGL)):'';if(/swiftshader|llvmpipe|software|basic render/i.test(rn)){R.dispose();return fallback()}}catch(e){}

 const fitPR=()=>{const lo=ultra0||H.classList.contains('lite');return Math.max(lo?.5:.6,Math.min(devicePixelRatio||1,ultra0?.85:1.75,Math.sqrt((ultra0?.8e6:2.4e6)/(innerWidth*innerHeight))))};
 let cap=fitPR(),pr=cap;R.setPixelRatio(pr);const setPR=v=>{pr=v;R.setPixelRatio(v);R.setSize(innerWidth,innerHeight,false)};R.toneMapping=T.ACESFilmicToneMapping;R.outputEncoding=T.sRGBEncoding;
 const bg=new T.Color(C.colors.bg),scene=new T.Scene();scene.background=bg;
 const cam=new T.PerspectiveCamera(32,1,.1,60);

 /* environnement lumineux procédural : softboxes pour les reflets métalliques */
 const es=new T.Scene();es.background=new T.Color(0x040405);
 [[10,6,0,9,0,5],[3,8,-10,2,2,3.5],[3,8,10,2,-3,3],[16,2,0,3,-10,2.4],[8,3,0,-1,10,.6]].forEach(([w,h,x,y,z,i])=>{
  const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:new T.Color(i,i,i),side:2}));m.position.set(x,y,z);m.lookAt(0,0,0);es.add(m)});
 if(!ultra0)try{const pm=new T.PMREMGenerator(R);scene.environment=pm.fromScene(es,.04).texture;pm.dispose()}catch(e){console.warn('env',e)}
 const d1=new T.DirectionalLight(0xffffff,.5);d1.position.set(-4,6,5);const d2=new T.DirectionalLight(0xbfd0ff,.8);d2.position.set(5,3,-6);scene.add(d1,d2,new T.HemisphereLight(0xffffff,0x1a1b1f,.7));

 /* textures */
 const cv=document.createElement('canvas'),tex=new T.CanvasTexture(cv);tex.encoding=T.sRGBEncoding;tex.anisotropy=R.capabilities.getMaxAnisotropy();

  const gr=g.createRadialGradient(w/2,0,0,w/2,0,w*.9);gr.addColorStop(0,C.colors.screen2);gr.addColorStop(.7,C.colors.screen);g.fillStyle=gr;g.fillRect(0,0,w,h);
  [[.18,.22,.55,'236,235,230',.14],[.82,.78,.5,'160,170,190',.13]].forEach(([a,b,r,c,o])=>{const q=g.createRadialGradient(w*a,h*b,0,w*a,h*b,w*r*.8);q.addColorStop(0,`rgba(${c},${o})`);q.addColorStop(1,`rgba(${c},0)`);g.fillStyle=q;g.fillRect(0,0,w,h)});
  const P=40,G=16,cw=(w-2*P-3*G)/4,ch=(h-2*P-2*G)/3;
  C.cells.forEach(c=>{const x=P+c.x*(cw+G),y=P+c.y*(ch+G),W=c.w*cw+(c.w-1)*G,Hh=c.h*ch+(c.h-1)*G;
   const f=g.createLinearGradient(x,y,x+W,y+Hh);f.addColorStop(0,'rgba(255,255,255,.17)');f.addColorStop(.45,'rgba(255,255,255,.04)');f.addColorStop(1,'rgba(255,255,255,.07)');
   g.fillStyle=f;g.beginPath();g.roundRect?g.roundRect(x,y,W,Hh,17):g.rect(x,y,W,Hh);g.fill();
   g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=1.2;g.stroke()});
  tex.needsUpdate=true})();
 if(C.assets.screen)new T.TextureLoader().load(C.assets.screen,t=>{t.encoding=T.sRGBEncoding;scrM.map=t;scrM.needsUpdate=true});
 const mc=document.createElement('canvas');mc.width=mc.height=256;
 {const g=mc.getContext('2d');g.translate(32,32);g.scale(8,8);g.translate(-12,-12);g.lineWidth=.8;g.lineCap='round';g.strokeStyle='#fff';
  g.stroke(new Path2D('M12 7c-1.6 0-2.6 1.2-3 2.8-.4 1.3-2.5 2.2-2.5 5 0 2.8 2.2 4.7 5.5 4.7s5.5-1.9 5.5-4.7c0-2.8-2.1-3.7-2.5-5C14.6 8.200 13.600 7 12 7z'));g.stroke(new Path2D('M12 7c0-2 1-3.500 3-4'))}

 /* matériaux et géométries partagés (instances réutilisées) */
 const metal=new T.MeshStandardMaterial({color:C.colors.metal,metalness:.82,roughness:.34}),
  keyM=new T.MeshStandardMaterial({color:C.colors.key,roughness:.45,metalness:.3}),
  padM=new T.MeshStandardMaterial({color:0x8c8f95,metalness:.9,roughness:.22}),
